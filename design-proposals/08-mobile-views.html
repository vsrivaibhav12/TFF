<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TFF — Mobile Experience</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            teal: { 50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a' },
            zinc: { 50:'#fafafa',100:'#f4f4f5',200:'#e4e4e7',300:'#d4d4d8',400:'#a1a1aa',500:'#71717a',600:'#52525b',700:'#3f3f46',800:'#27272a',900:'#18181b' }
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .swipe-reveal { position: relative; overflow: hidden; }
    .swipe-actions { position: absolute; right: 0; top: 0; bottom: 0; display: flex; transform: translateX(100%); transition: transform 0.2s; }
    .swipe-reveal.swiped .swipe-actions { transform: translateX(0); }
    .swipe-reveal.swiped .swipe-content { transform: translateX(-120px); }
    .swipe-content { transition: transform 0.2s; }
    .sheet-enter { animation: sheetUp 0.3s cubic-bezier(0.16,1,0.3,1); }
    @keyframes sheetUp { from { transform:translateY(100%) } to { transform:translateY(0) } }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased">

  <!-- Mobile Frame -->
  <div class="max-w-md mx-auto bg-zinc-50 min-h-screen relative pb-20">
    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white border-b border-zinc-200 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-teal-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">FF</div>
        <span class="font-semibold text-zinc-900">My day</span>
      </div>
      <div class="flex items-center gap-3">
        <button class="relative p-1.5 text-zinc-500">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
        </button>
        <div class="w-7 h-7 rounded-full bg-teal-700 text-white flex items-center justify-center text-xs font-semibold">AK</div>
      </div>
    </header>

    <!-- Quick Stats -->
    <div class="px-4 py-4 grid grid-cols-3 gap-3">
      <div class="bg-white border border-zinc-200 rounded-xl p-3 text-center">
        <div class="text-xl font-bold text-red-600">2</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">Overdue</div>
      </div>
      <div class="bg-white border border-zinc-200 rounded-xl p-3 text-center">
        <div class="text-xl font-bold text-zinc-900">3</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">Today</div>
      </div>
      <div class="bg-white border border-zinc-200 rounded-xl p-3 text-center">
        <div class="text-xl font-bold text-amber-600">1</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">Approval</div>
      </div>
    </div>

    <!-- Feed -->
    <div class="px-4 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-zinc-900">Your work</h2>
        <button class="text-xs text-teal-600 font-medium">See all</button>
      </div>

      <!-- Swipeable Card 1 -->
      <div class="swipe-reveal rounded-xl" onclick="this.classList.toggle('swiped')">
        <div class="swipe-content bg-white border border-zinc-200 rounded-xl p-4 relative z-10">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-red-50 flex items-center justify-center shrink-0">
              <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-zinc-900">GSTR-3B filing</span>
                <span class="px-1.5 py-0.5 bg-red-50 text-red-700 text-[10px] font-bold rounded">OVERDUE</span>
              </div>
              <p class="text-xs text-zinc-500 mt-0.5">Swadeshi Bazaar · GST · Due 20 May</p>
              <div class="flex items-center gap-2 mt-2">
                <div class="w-5 h-5 rounded-full bg-teal-600 text-white flex items-center justify-center text-[10px]">PS</div>
                <span class="text-xs text-zinc-500">Priya Sharma</span>
              </div>
            </div>
          </div>
        </div>
        <div class="swipe-actions">
          <button class="w-[60px] bg-teal-600 text-white flex flex-col items-center justify-center text-[10px] font-medium">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            Open
          </button>
          <button class="w-[60px] bg-amber-500 text-white flex flex-col items-center justify-center text-[10px] font-medium">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Snooze
          </button>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="bg-white border border-zinc-200 rounded-xl p-4">
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-zinc-900">Reply to query</div>
            <p class="text-xs text-zinc-500 mt-0.5">Krishi Rasayan · IT returns</p>
            <div class="flex gap-2 mt-2">
              <button class="px-3 py-1.5 bg-teal-600 text-white text-xs font-medium rounded-lg">Reply</button>
              <button class="px-3 py-1.5 bg-zinc-100 text-zinc-600 text-xs font-medium rounded-lg">View</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="bg-white border border-zinc-200 rounded-xl p-4">
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-zinc-900">Approve leave</div>
            <p class="text-xs text-zinc-500 mt-0.5">Ankit K. · 3 days · Family function</p>
            <div class="flex gap-2 mt-2">
              <button class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-medium rounded-lg">Approve</button>
              <button class="px-3 py-1.5 bg-zinc-100 text-zinc-600 text-xs font-medium rounded-lg">Review</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fixed bottom-20 right-4 w-14 h-14 bg-teal-600 text-white rounded-full shadow-lg flex items-center justify-center z-40 active:scale-95 transition-transform">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    </button>

    <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-zinc-200 z-40 pb-[env(safe-area-inset-bottom,0)]">
      <div class="max-w-md mx-auto flex items-center justify-around py-2">
        <button class="flex flex-col items-center gap-0.5 py-1 px-4 text-teal-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span class="text-[10px] font-medium">Home</span>
        </button>
        <button class="flex flex-col items-center gap-0.5 py-1 px-4 text-zinc-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
          <span class="text-[10px] font-medium">Inbox</span>
        </button>
        <button class="flex flex-col items-center gap-0.5 py-1 px-4 text-zinc-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span class="text-[10px] font-medium">Clients</span>
        </button>
        <button class="flex flex-col items-center gap-0.5 py-1 px-4 text-zinc-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <span class="text-[10px] font-medium">Profile</span>
        </button>
      </div>
    </nav>

    <!-- Bottom Sheet (demo, hidden by default) -->
    <div id="sheet" class="hidden fixed inset-0 z-50">
      <div class="absolute inset-0 bg-black/40" onclick="document.getElementById('sheet').classList.add('hidden')"></div>
      <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl sheet-enter max-w-md mx-auto">
        <div class="flex items-center justify-center py-3">
          <div class="w-10 h-1 bg-zinc-300 rounded-full"></div>
        </div>
        <div class="px-4 pb-6">
          <h3 class="text-lg font-semibold text-zinc-900 mb-4">Create new</h3>
          <div class="space-y-2">
            <button class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-zinc-50 transition-colors text-left">
              <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center">
                <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
              </div>
              <div>
                <div class="text-sm font-medium text-zinc-900">Task</div>
                <div class="text-xs text-zinc-500">Create a new task for any client</div>
              </div>
            </button>
            <button class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-zinc-50 transition-colors text-left">
              <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center">
                <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
              </div>
              <div>
                <div class="text-sm font-medium text-zinc-900">Query</div>
                <div class="text-xs text-zinc-500">Send a message to a client</div>
              </div>
            </button>
            <button class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-zinc-50 transition-colors text-left">
              <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center">
                <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </div>
              <div>
                <div class="text-sm font-medium text-zinc-900">Timer</div>
                <div class="text-xs text-zinc-500">Start tracking time on a task</div>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Show sheet on FAB click
      document.querySelector('.fixed.bottom-20').addEventListener('click', () => {
        document.getElementById('sheet').classList.remove('hidden');
      });
    </script>
  </div>

</body>
</html>
